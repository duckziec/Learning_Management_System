server:
  port: ${COURSE_SERVICE_PORT:8082}
  servlet:
    context-path: /course

spring:
  application:
    name: course-service
  datasource:
    url: ${COURSE_DB_URL:jdbc:mysql://localhost:3306/course_lms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
    username: ${COURSE_DB_USERNAME:root}
    password: ${COURSE_DB_PASSWORD:mysqladmin123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CourseHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
        connection:
          autocommit: false
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 1
    baseline-on-migrate: true
    sql-migration-prefix: V
    sql-migration-separator: __

  servlet:
    multipart:
      max-file-size: ${COURSE_MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${COURSE_MULTIPART_MAX_REQUEST_SIZE:25MB}

  data:
    mongodb:
      uri: ${COURSE_MONGODB_URI:mongodb://mongoadmin:mongoadmin123@localhost:27017/course_lms_mongo?authSource=admin}

# ===== Eureka =====
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

services:
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081/identity}
  assignment-service:
    url: ${ASSIGNMENT_SERVICE_URL:http://localhost:8083/assignment}

logging:
  level:
    com.lms.courseservice: ${COURSE_LOG_LEVEL:DEBUG}

management:
  endpoint:
    health:
      show-details: always
      show-components: always
      group:
        liveness:
          include: ping
  endpoints:
    web:
      exposure:
        include: health, info
      cors:
        allowed-origins:
          - "http://localhost:5173"
          - "http://localhost:3000"
          - "http://127.0.0.1:5173"
        allowed-methods:
          - GET

minio:
  url: ${MINIO_URL:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket-name: ${MINIO_BUCKET:lms-course-bucket}
  presigned-expiry-minutes: ${COURSE_MINIO_PRESIGNED_EXPIRY_MINUTES:5}

google:
  service-account:
    credentials-file: ${GOOGLE_SERVICE_ACCOUNT_FILE:classpath:google-service-account.json}
    delegated-email: ${GOOGLE_DELEGATED_EMAIL:}
  calendar:
    calendar-id: ${GOOGLE_CALENDAR_ID:primary}
