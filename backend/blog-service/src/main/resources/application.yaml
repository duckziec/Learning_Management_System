server:
  port: ${BLOG_SERVICE_PORT:8084}
  servlet:
    context-path: /blog

spring:
  application:
    name: blog-service
  datasource:
    url: ${BLOG_DB_URL:jdbc:mysql://localhost:3306/blog_lms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
    username: ${BLOG_DB_USERNAME:root}
    password: ${BLOG_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BlogHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
        connection:
          autocommit: false
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 1
    baseline-on-migrate: true
    sql-migration-prefix: V
    sql-migration-separator: __

# ===== Eureka =====
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

services:
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081/identity}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:${MINIO_URL:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:change-me}
  secret-key: ${MINIO_SECRET_KEY:change-me}
  bucket-name: ${MINIO_BLOG_BUCKET:lms-blog-bucket}
  max-file-size-bytes: ${MINIO_BLOG_MAX_FILE_SIZE_BYTES:5242880}
  public-read-enabled: ${MINIO_BLOG_PUBLIC_READ_ENABLED:true}

blog:
  storage:
    thumbnail-folder: ${BLOG_THUMBNAIL_FOLDER:thumbnails}

logging:
  level:
    com.lms.blogservice: ${BLOG_LOG_LEVEL:DEBUG}

management:
  endpoint:
    health:
      show-details: always
      show-components: always
      group:
        liveness:
          include: ping
  endpoints:
    web:
      exposure:
        include: health, info
      cors:
        allowed-origins:
          - "${FRONTEND_URL:http://localhost:5173}"
        allowed-methods:
          - GET
