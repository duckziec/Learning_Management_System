server:
  port: ${SERVER_PORT:8080}

app:
  prefix-api: /api

# ===== JWT Config =====
jwt:
  signer-key: ${JWT_SIGNER_KEY:3fb729ab82e9422b00d6d6fba8a767b3e44f330853fd68673f7dbfd826abf1fa}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redisadmin123}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    gateway:
      routes:
        # ===== Identity Service =====
        - id: identity-public
          uri: lb://identity-service
          predicates:
            - Path=${app.prefix-api}/identity/auth/**
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization   # Strip JWT trước khi forward
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_RATE_LIMIT_REPLENISH_RATE:1}
                redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_RATE_LIMIT_BURST_CAPACITY:5}
                redis-rate-limiter.requestedTokens: 1
          # Không có AuthFilter — public endpoint

        - id: identity-public-profile
          uri: lb://identity-service
          predicates:
            - Path=${app.prefix-api}/identity/users/*/profile
            - Method=GET
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1

        - id: identity-private
          uri: lb://identity-service
          predicates:
            - Path=${app.prefix-api}/identity/users/**
          filters:
            - StripPrefix=1
            - AuthFilter   # Verify JWT, inject headers
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: identityServiceCircuitBreaker
                fallbackUri: forward:/fallback/identity-service

        - id: identity-admin
          uri: lb://identity-service
          predicates:
            - Path=${app.prefix-api}/identity/admin/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: identityServiceCircuitBreaker
                fallbackUri: forward:/fallback/identity-service

        - id: identity-storage
          uri: lb://identity-service
          predicates:
            - Path=${app.prefix-api}/identity/storage/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: identityServiceCircuitBreaker
                fallbackUri: forward:/fallback/identity-service

        #       storage (MinIO presigned URLs, course-service)
        - id: storage-service
          uri: lb://course-service
          predicates:
            - Path=${app.prefix-api}/storage/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_STORAGE_RATE_LIMIT_REPLENISH_RATE:3}
                redis-rate-limiter.burstCapacity: ${GATEWAY_STORAGE_RATE_LIMIT_BURST_CAPACITY:10}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: courseServiceCircuitBreaker
                fallbackUri: forward:/fallback/course-service

        #       course-service
        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=${app.prefix-api}/course/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: courseServiceCircuitBreaker
                fallbackUri: forward:/fallback/course-service

        #       assignment-service AI preview endpoints (long-running)
        - id: assignment-quiz-ai-service
          uri: lb://assignment-service
          order: -20
          predicates:
            - Path=${app.prefix-api}/assignment/questions/courses/*/ai-generate/preview
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_ASSIGNMENT_AI_RATE_LIMIT_REPLENISH_RATE:2}
                redis-rate-limiter.burstCapacity: ${GATEWAY_ASSIGNMENT_AI_RATE_LIMIT_BURST_CAPACITY:5}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: assignmentAiServiceCircuitBreaker
                fallbackUri: forward:/fallback/assignment-service

        - id: assignment-testcase-ai-service
          uri: lb://assignment-service
          order: -20
          predicates:
            - Path=${app.prefix-api}/assignment/problems/testcases/ai-generate/preview
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_ASSIGNMENT_AI_RATE_LIMIT_REPLENISH_RATE:2}
                redis-rate-limiter.burstCapacity: ${GATEWAY_ASSIGNMENT_AI_RATE_LIMIT_BURST_CAPACITY:5}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: assignmentAiServiceCircuitBreaker
                fallbackUri: forward:/fallback/assignment-service

        #       assignment-service
        - id: assignment-service
          uri: lb://assignment-service
          order: 0
          predicates:
            - Path=${app.prefix-api}/assignment/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_ASSIGNMENT_RATE_LIMIT_REPLENISH_RATE:5}
                redis-rate-limiter.burstCapacity: ${GATEWAY_ASSIGNMENT_RATE_LIMIT_BURST_CAPACITY:10}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: assignmentServiceCircuitBreaker
                fallbackUri: forward:/fallback/assignment-service

        #       blog-service public endpoints
        - id: blog-public
          uri: lb://blog-service
          predicates:
            - Path=${app.prefix-api}/blog/posts/public,${app.prefix-api}/blog/posts/public/**,${app.prefix-api}/blog/tags,${app.prefix-api}/blog/tags/search,${app.prefix-api}/blog/posts/*/comments
            - Method=GET
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1

        #       blog-service private endpoints
        - id: blog-service
          uri: lb://blog-service
          predicates:
            - Path=${app.prefix-api}/blog/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: blogServiceCircuitBreaker
                fallbackUri: forward:/fallback/blog-service

        - id: chatbot-service
          uri: lb://chatbot-service
          predicates:
            - Path=${app.prefix-api}/chatbot/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userThenIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_CHATBOT_RATE_LIMIT_REPLENISH_RATE:3}
                redis-rate-limiter.burstCapacity: ${GATEWAY_CHATBOT_RATE_LIMIT_BURST_CAPACITY:10}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: chatbotServiceCircuitBreaker
                fallbackUri: forward:/fallback/chatbot-service

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "${FRONTEND_URL:http://localhost:5173}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
              - "Content-Type"
              - "Authorization"
            allow-credentials: true
            max-age: 3600
            exposed-headers:
              - "Authorization"
              - "Content-Type"

# ===== Eureka =====
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ===== Resilience4j cho Gateway =====
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: ${GATEWAY_CIRCUIT_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${GATEWAY_CIRCUIT_MINIMUM_CALLS:5}
        failure-rate-threshold: ${GATEWAY_CIRCUIT_FAILURE_RATE_THRESHOLD:50}
        wait-duration-in-open-state: ${GATEWAY_CIRCUIT_WAIT_DURATION:10s}
        permitted-number-of-calls-in-half-open-state: ${GATEWAY_CIRCUIT_HALF_OPEN_CALLS:3}
  timelimiter:
    configs:
      default:
        timeout-duration: ${GATEWAY_CIRCUIT_TIMEOUT:5s}
    instances:
      assignmentServiceCircuitBreaker:
        timeout-duration: ${GATEWAY_ASSIGNMENT_CIRCUIT_TIMEOUT:15s}
      assignmentAiServiceCircuitBreaker:
        timeout-duration: ${GATEWAY_ASSIGNMENT_AI_CIRCUIT_TIMEOUT:130s}
      chatbotServiceCircuitBreaker:
        timeout-duration: ${GATEWAY_CHATBOT_CIRCUIT_TIMEOUT:130s}
      courseServiceCircuitBreaker:
        timeout-duration: ${GATEWAY_STORAGE_CIRCUIT_TIMEOUT:15s}

# ===== Logging =====
logging:
  level:
    org.springframework.cloud.gateway: ${API_GATEWAY_SPRING_CLOUD_GATEWAY_LOG_LEVEL:INFO}
    com.lms.apigateway: ${API_GATEWAY_LOG_LEVEL:DEBUG}
    reactor.netty: ${API_GATEWAY_REACTOR_NETTY_LOG_LEVEL:INFO}

management:
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: ping
  endpoints:
    web:
      exposure:
        include: health, info
      cors:
        allowed-origins:
          - "${FRONTEND_URL:http://localhost:5173}"
        allowed-methods:
          - GET
